<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026 灵魂运势测试 · 超准</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:#0b0a1a; color:#eee; overflow:hidden;
  }
  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px; text-align:center;
    transition:opacity .45s ease; 
  }
  .screen.hide { opacity:0; pointer-events:none; }
  [hidden]{ display:none !important; }

  /* ---------- 1. 假运势落地页 ---------- */
  #landing {
    background:
      radial-gradient(1200px 600px at 20% -10%, #2b1a5e 0%, transparent 60%),
      radial-gradient(900px 500px at 85% 110%, #4a1942 0%, transparent 55%),
      linear-gradient(160deg,#141031 0%, #0b0a1a 100%);
  }
  #landing::before {
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #fff 60%, transparent),
      radial-gradient(1px 1px at 32% 68%, #cfd 60%, transparent),
      radial-gradient(2px 2px at 58% 14%, #fff 60%, transparent),
      radial-gradient(1px 1px at 72% 46%, #fdf 60%, transparent),
      radial-gradient(1.5px 1.5px at 88% 78%, #fff 60%, transparent),
      radial-gradient(1px 1px at 45% 88%, #ffd 60%, transparent),
      radial-gradient(1.5px 1.5px at 66% 92%, #fff 60%, transparent);
    animation: twinkle 3.2s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from{opacity:.25} to{opacity:.65} }
  .brand { font-size:14px; letter-spacing:4px; color:#b9a6ff; margin-bottom:26px; position:relative; }
  .orb {
    font-size:76px; line-height:1; position:relative; margin-bottom:18px;
    filter: drop-shadow(0 0 26px rgba(150,110,255,.55));
    animation: float 3.4s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  h1.title {
    font-size: clamp(26px, 6vw, 42px); font-weight:800; letter-spacing:1px;
    background: linear-gradient(90deg,#cdbcff,#ff9ad5,#9ad9ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:12px; position:relative;
  }
  .sub { color:#b9b3d9; font-size:15px; line-height:1.7; margin-bottom:30px; position:relative; }
  .sub b { color:#ffd76e; }
  .card {
    position:relative; width:min(420px, 92vw);
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.12);
    border-radius:20px; padding:26px 22px; backdrop-filter: blur(6px);
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  #nameInput {
    width:100%; padding:14px 16px; font-size:16px; color:#fff; outline:none;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.22);
    border-radius:12px; text-align:center; transition:border-color .2s;
  }
  #nameInput:focus { border-color:#9a7bff; box-shadow:0 0 0 3px rgba(154,123,255,.18); }
  #startBtn {
    width:100%; margin-top:14px; padding:15px; font-size:18px; font-weight:800;
    letter-spacing:2px; color:#fff; cursor:pointer; border:none; border-radius:12px;
    background:linear-gradient(90deg,#7b4dff,#c44dff,#ff4da6);
    background-size:200% 100%;
    box-shadow:0 10px 26px rgba(160,70,255,.4);
    transition:transform .12s, background-position .4s;
    touch-action:manipulation;
  }
  #startBtn:hover { background-position:100% 0; transform:translateY(-2px); }
  #startBtn:active { transform:scale(.97); }
  .counter { margin-top:16px; font-size:12.5px; color:#8f89b3; position:relative; }
  .counter b { color:#ffd76e; }
  .disclaimer { position:absolute; bottom:18px; left:0; right:0; font-size:11px; color:#5d5878; }

  /* ---------- 2. 假加载页 ---------- */
  #loading {
    background: radial-gradient(900px 500px at 50% 30%, #1c1440 0%, #07060f 75%);
    transition: opacity .3s;
  }
  .ring {
    width:120px; height:120px; border-radius:50%; margin-bottom:34px; position:relative;
    background: radial-gradient(circle at 35% 30%, #6f5bd8, #241a4d 70%);
    box-shadow: 0 0 60px rgba(120,90,255,.5), inset 0 0 30px rgba(0,0,0,.6);
    animation: spinPulse 2.6s ease-in-out infinite;
  }
  .ring::after {
    content:"👁"; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:44px;
  }
  @keyframes spinPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  #loadStep {
    font-size:17px; color:#cfc9ee; min-height:26px; letter-spacing:1px; margin-bottom:22px;
  }
  .barWrap {
    width:min(340px,80vw); height:8px; border-radius:99px;
    background:rgba(255,255,255,.12); overflow:hidden;
  }
  #bar {
    height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#7b4dff,#ff4da6);
    transition: width 1s cubic-bezier(.3,.7,.4,1);
  }
  #loadPct { margin-top:12px; font-size:12px; color:#8f89b3; font-variant-numeric:tabular-nums; }

  /* ---------- 3. 惊吓页 ---------- */
  #scare { background:#000; padding:0; }
  #shakeLayer { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; will-change:transform; }
  #faceWrap { width:min(88vw, 62vh); position:relative; }
  #faceWrap svg { width:100%; height:auto; display:block; overflow:visible; }
  #faceWrap.mirror svg { transform:scaleX(-1) scaleY(1.02) hue-rotate(28deg) saturate(1.5) contrast(1.2); }
  #scareName {
    position:absolute; top:6%; left:0; right:0; z-index:5;
    font-size:clamp(28px,7vw,60px); font-weight:900; color:#ff1f1f;
    text-shadow: 0 0 18px rgba(255,0,0,.8), 3px 3px 0 #400;
    letter-spacing:6px; animation: glitch .12s steps(2) infinite;
  }
  @keyframes glitch {
    0%{ transform:translate(-3px,1px) skewX(-2deg); }
    50%{ transform:translate(3px,-2px) skewX(2deg); }
    100%{ transform:translate(-1px,2px); }
  }
  #strobe {
    position:absolute; inset:0; z-index:6; pointer-events:none;
    animation: strobe .14s steps(2) infinite;
  }
  @keyframes strobe { 0%{background:transparent} 50%{background:rgba(255,10,10,.30)} }
  #vignette {
    position:absolute; inset:0; z-index:7; pointer-events:none;
    background: radial-gradient(circle at 50% 46%, transparent 34%, rgba(60,0,0,.55) 78%, #000 100%);
    animation: breathe .5s ease-in-out infinite alternate;
  }
  @keyframes breathe { from{opacity:.85} to{opacity:1} }
  #flash { position:absolute; inset:0; z-index:9; background:#fff; pointer-events:none; opacity:0; }
  #scare.on #flash { animation: bigflash .5s ease-out forwards; }
  @keyframes bigflash { 0%{opacity:1} 100%{opacity:0} }

  /* ---------- 4. 揭晓页 ---------- */
  #reveal { background:#0b0a1a; gap:6px; }
  #reveal .em { font-size:64px; animation: bounce .9s ease infinite alternate; }
  @keyframes bounce { from{transform:translateY(0) rotate(-4deg)} to{transform:translateY(-12px) rotate(4deg)} }
  #reveal h1 { font-size:clamp(26px,6vw,40px); margin:10px 0 6px; color:#ffd76e; }
  #reveal .joke { color:#b9b3d9; font-size:15px; line-height:1.9; max-width:460px; }
  .stats {
    display:flex; gap:26px; margin:22px 0 6px;
  }
  .stat {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    padding:14px 20px; border-radius:14px; min-width:120px;
  }
  .stat .num { font-size:30px; font-weight:800; color:#ff6b81; font-variant-numeric:tabular-nums; }
  .stat .lab { font-size:12px; color:#8f89b3; margin-top:4px; }
  .btnRow { display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; justify-content:center; }
  .btn {
    padding:14px 22px; font-size:15.5px; font-weight:700; border:none; border-radius:12px;
    cursor:pointer; color:#fff; touch-action:manipulation; transition:transform .12s, filter .2s;
  }
  .btn:hover{ transform:translateY(-2px); filter:brightness(1.12); }
  .btn:active{ transform:scale(.96); }
  .btn.primary { background:linear-gradient(90deg,#ff4da6,#ff7a3d); box-shadow:0 8px 24px rgba(255,80,140,.35); }
  .btn.ghost { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); }
  .tinyTip { margin-top:18px; font-size:12px; color:#5d5878; }

  /* ---------- 黑幕 ---------- */
  #blackout {
    position:fixed; inset:0; background:#000; z-index:50;
    opacity:0; pointer-events:none; transition:opacity .12s;
  }
  #blackout.on { opacity:1; pointer-events:auto; }

  #toast {
    position:fixed; left:50%; bottom:8%; transform:translateX(-50%) translateY(20px);
    background:rgba(20,18,40,.92); border:1px solid rgba(255,255,255,.2);
    padding:12px 22px; border-radius:99px; font-size:14px; color:#fff; z-index:99;
    opacity:0; transition:all .3s; pointer-events:none;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var MUTED = /[?&#]mute/.test(location.href);   // ?mute = 无声预览模式（自己测试用）

  /* ================= 音频引擎（全部 Web Audio 合成，无需音频文件） ================= */
  var ctx = null, outBus = null, tensionNodes = [], scareNodes = [];

  function ensureAudio(){
    if (MUTED) return null;
    if (!ctx) {
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        outBus = ctx.createGain();   // 全局输出总线：加 ?vol=0.05 可小声试听
        var v = parseFloat((location.search.match(/vol=([\d.]+)/) || [])[1]);
        outBus.gain.value = isNaN(v) ? 1 : Math.max(0.0001, Math.min(1, v));
        outBus.connect(ctx.destination);
      } catch(e){ return null; }
    }
    if (ctx.state === 'suspended') { ctx.resume(); }
    return ctx;
  }
  function noiseBuffer(c, dur){
    var len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
    return buf;
  }
  function shaperCurve(amount){
    var n = 1024, curve = new Float32Array(n);
    for (var i=0;i<n;i++){ var x = i*2/n-1; curve[i] = Math.tanh(x*amount); }
    return curve;
  }
  function env(g, t, peak, decay){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+decay);
  }

  /* 加载阶段：低鸣 + 上升音 + 加速心跳 */
  function startTension(totalSec){
    var c = ensureAudio(); if(!c) return;
    var t0 = c.currentTime;
      var master = c.createGain(); master.gain.value = 0.9; master.connect(outBus);
    tensionNodes.push(master);

    // 低频嗡鸣
    [55, 55.7, 82.5].forEach(function(f, i){
      var o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      var g = c.createGain(); g.gain.value = 0;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.045 - i*0.01, t0+1.2);
      o.connect(g).connect(master); o.start(t0); o.stop(t0+totalSec+2);
      tensionNodes.push(o);
    });
    // 缓慢上升的不祥音
    var riser = c.createOscillator(); riser.type = 'sawtooth';
    riser.frequency.setValueAtTime(70, t0);
    riser.frequency.exponentialRampToValueAtTime(640, t0+totalSec);
    var rf = c.createBiquadFilter(); rf.type='bandpass'; rf.Q.value = 2;
    rf.frequency.setValueAtTime(120, t0);
    rf.frequency.exponentialRampToValueAtTime(1400, t0+totalSec);
    var rg = c.createGain();
    rg.gain.setValueAtTime(0.0001, t0);
    rg.gain.linearRampToValueAtTime(0.075, t0+totalSec*0.92);
    riser.connect(rf).connect(rg).connect(master);
    riser.start(t0); riser.stop(t0+totalSec+1);
    tensionNodes.push(riser);

    // 加速心跳 lub-dub
    var beats = [1.2, 1.95, 2.6, 3.15, 3.6, 3.95, 4.25, 4.48, 4.66];
    beats.forEach(function(bt){
      [0, 0.17].forEach(function(off, k){
        var t = t0 + bt + off; if (t > t0+totalSec) return;
        var o = c.createOscillator(); o.type='sine';
        o.frequency.setValueAtTime(58, t); o.frequency.exponentialRampToValueAtTime(38, t+0.12);
        var g = c.createGain(); env(g, t, k? 0.16:0.24, 0.14);
        o.connect(g).connect(master); o.start(t); o.stop(t+0.2);
        tensionNodes.push(o);
      });
    });
  }
  function stopTension(hard){
    tensionNodes.forEach(function(n){
      try {
        if (n.gain) { n.gain.cancelScheduledValues(ctx.currentTime);
          n.gain.setValueAtTime(hard? 0.0001 : n.gain.value, ctx.currentTime);
          if(!hard) n.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.08); }
        if (n.stop) n.stop(ctx.currentTime + (hard?0:0.1));
      } catch(e){}
    });
    tensionNodes = [];
  }

  /* 惊吓爆音：子低音重击 + 嘶吼噪声 + 不和谐尖叫簇 + 高频刺鸣 */
  function scareSting(){
    var c = ensureAudio(); if(!c) return;
    var t = c.currentTime;
    var comp = c.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=6; comp.ratio.value=14;
    comp.attack.value=0.002; comp.release.value=0.25;
    // 压缩后补偿增益 + 软削波：在用户当前音量下压榨最大响度且不产生刺耳硬削波
    var makeup = c.createGain(); makeup.gain.value=1.35;
    var clip = c.createWaveShaper(); clip.curve = shaperCurve(1.6); clip.oversample='4x';
    var master = c.createGain(); master.gain.value=1;
    master.connect(comp).connect(makeup).connect(clip).connect(outBus);
    scareNodes.push(master);

    function reg(o){ scareNodes.push(o); return o; }

    // 1) 瞬态点击
    var click = c.createBufferSource(); click.buffer = noiseBuffer(c, 0.03);
    var cg = c.createGain(); env(cg, t, 1.0, 0.05);
    click.connect(cg).connect(master); click.start(t); reg(click);

    // 2) 子低音重击（三连，贯穿全程）
    [[0, 60, 28, 1.0, 1.7], [2.1, 48, 26, 0.8, 1.3], [4.3, 52, 26, 0.9, 1.6], [6.2, 44, 24, 1.0, 1.6]].forEach(function(s){
      var st = t + s[0];
      var o = c.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(s[1], st);
      o.frequency.exponentialRampToValueAtTime(s[2], st + s[4]*0.85);
      var g = c.createGain(); env(g, st, s[3], s[4]);
      o.connect(g).connect(master); o.start(st); o.stop(st + s[4] + 0.15); reg(o);
    });

    // 3) 嘶吼噪声（长下扫 + 失真）+ 低频咆哮尾
    var ns = c.createBufferSource(); ns.buffer = noiseBuffer(c, 3.8);
    var bp = c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
    bp.frequency.setValueAtTime(3600, t); bp.frequency.exponentialRampToValueAtTime(420, t+3.2);
    var ws = c.createWaveShaper(); ws.curve = shaperCurve(24); ws.oversample='2x';
    var ng = c.createGain(); env(ng, t, 0.72, 3.6);
    ns.connect(bp).connect(ws).connect(ng).connect(master);
    ns.start(t); reg(ns);

    var growl = c.createBufferSource(); growl.buffer = noiseBuffer(c, 6.0);
    var gb = c.createBiquadFilter(); gb.type='bandpass'; gb.Q.value=1.4; gb.frequency.value=170;
    var gw = c.createWaveShaper(); gw.curve = shaperCurve(10); gw.oversample='2x';
    var gg = c.createGain();
    gg.gain.setValueAtTime(0.0001, t+2.2);
    gg.gain.exponentialRampToValueAtTime(0.5, t+2.55);
    gg.gain.exponentialRampToValueAtTime(0.0001, t+7.9);
    var gl = c.createOscillator(); gl.frequency.value=6.5;      // 咆哮颤动
    var glg = c.createGain(); glg.gain.value=0.16;
    gl.connect(glg).connect(gg.gain);
    growl.connect(gb).connect(gw).connect(gg).connect(master);
    growl.start(t+2.2); growl.stop(t+8.05);
    gl.start(t+2.2); gl.stop(t+8.05); reg(growl); reg(gl);

    // 4) 尖叫簇（不和谐锯齿波下坠）——多轮回声拖长
    [620, 656, 881].forEach(function(f, i){
      [[0, 0.34], [0.5, 0.22], [1.1, 0.15], [2.0, 0.12], [3.0, 0.10], [4.2, 0.08]].forEach(function(e){
        var tt = t + e[0];
        var o = c.createOscillator(); o.type='sawtooth';
        o.frequency.setValueAtTime(f, tt);
        o.frequency.exponentialRampToValueAtTime(f*0.4, tt+2.4);
        var g = c.createGain(); env(g, tt, Math.max(0.05, e[1] - i*0.03), 2.6);
        o.connect(g).connect(master); o.start(tt); o.stop(tt+2.7); reg(o);
      });
    });
    // 长坠哀嚎：一对不和谐锯齿缓缓下滑 4 秒
    [880, 915].forEach(function(f){
      var o = c.createOscillator(); o.type='sawtooth';
      var st = t + 0.8;
      o.frequency.setValueAtTime(f, st);
      o.frequency.exponentialRampToValueAtTime(160, st+6.8);
      var g = c.createGain(); env(g, st, 0.17, 7.0);
      o.connect(g).connect(master); o.start(st); o.stop(st+7.2); reg(o);
    });

    // 5) 高频刺鸣（颤音方波）×2
    [[0, 2600, 1500, 1.5, 0.09], [3.0, 2900, 1900, 1.8, 0.07], [5.4, 2400, 1700, 1.6, 0.06]].forEach(function(s){
      var st = t + s[0];
      var sq = c.createOscillator(); sq.type='square';
      sq.frequency.setValueAtTime(s[1], st);
      sq.frequency.exponentialRampToValueAtTime(s[2], st+s[3]);
      var sqg = c.createGain(); sqg.gain.value=0;
      var lfo = c.createOscillator(); lfo.frequency.value=28;
      var lg = c.createGain(); lg.gain.value=s[4];
      lfo.connect(lg).connect(sqg.gain);
      sqg.gain.setValueAtTime(s[4], st);
      sqg.gain.exponentialRampToValueAtTime(0.0001, st+s[3]);
      sq.connect(sqg).connect(master);
      sq.start(st); sq.stop(st+s[3]+0.1); lfo.start(st); lfo.stop(st+s[3]+0.1);
      reg(sq); reg(lfo);
    });

    // 6) 尾音低鸣：不和谐低频持续到结束，收尾不发空
    var droneGain = c.createGain();
    droneGain.gain.setValueAtTime(0.0001, t+3.0);
    droneGain.gain.exponentialRampToValueAtTime(0.14, t+3.4);
    droneGain.gain.exponentialRampToValueAtTime(0.0001, t+7.9);
    droneGain.connect(master);
    [62, 66, 99].forEach(function(f, i){
      var o = c.createOscillator(); o.type = i===2 ? 'sawtooth' : 'sine';
      o.frequency.value = f;
      var og = c.createGain(); og.gain.value = i===2 ? 0.35 : 1;
      o.connect(og).connect(droneGain);
      o.start(t+3.0); o.stop(t+8.0); reg(o);
    });
    reg(droneGain);
  }
  function stopScareAudio(){
    scareNodes.forEach(function(n){
      try { if (n.gain) { n.gain.cancelScheduledValues(ctx.currentTime); n.gain.setValueAtTime(0.0001, ctx.currentTime); }
            if (n.stop) n.stop(ctx.currentTime+0.02); } catch(e){}
    });
    scareNodes = [];
  }
  /* 揭晓页小铃音 */
  function chime(){
    var c = ensureAudio(); if(!c) return;
    var t = c.currentTime;
    var g = c.createGain(); g.gain.value=0.16; g.connect(outBus);
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
      var o = c.createOscillator(); o.type='triangle'; o.frequency.value=f;
      var eg = c.createGain(); env(eg, t+i*0.09, 0.5, 0.5);
      o.connect(eg).connect(g); o.start(t+i*0.09); o.stop(t+i*0.09+0.6);
    });
  }

  /* ================= 流程控制 ================= */
  var timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  var scareNameEl = $('#scareName'), loadStepEl = $('#loadStep'),
      barEl = $('#bar'), pctEl = $('#loadPct'),
      titleTimer = null, shakeRAF = 0;

  function show(el){ el.hidden = false; el.classList.remove('hide'); }
  function hide(el){ el.hidden = true; el.classList.add('hide'); }

  function startLoading(){
    var name = ($('#nameInput').value || '').trim() || '朋友';
    ensureAudio(); // 借用户点击解锁音频
    try {
      var el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    } catch(e){}

    hide($('#landing')); show($('#loading'));
    if (!MUTED) { try { startTension(4.75); } catch(e){ (window.__audioErr=window.__audioErr||[]).push('tension:'+((e&&e.message)||e)); } }

    var steps = [
      [0,    '正在连接命运服务器……', 8],
      [1150, '正在解析「' + name + '」的灵魂频率……', 34],
      [2300, '正在比对 12,847 份命运样本……', 64],
      [3400, '正在生成您的专属运势报告……', 86],
      [4400, '正在为您展示结果……', 97]
    ];
    steps.forEach(function(s, i){
      later(function(){
        loadStepEl.textContent = s[1];
        barEl.style.width = s[2] + '%';
        pctEl.textContent = s[2] + '%';
      }, s[0]);
    });

    later(function(){ $('#blackout').classList.add('on'); }, 4750);
    later(function(){ triggerScare(name); }, 5060);
  }

  function triggerScare(name){
    hide($('#loading')); show($('#scare'));
    $('#scare').classList.add('on');
    $('#blackout').classList.remove('on');

    if (!MUTED) { try { stopTension(true); scareSting(); } catch(e){ (window.__audioErr=window.__audioErr||[]).push('sting:'+((e&&e.message)||e)); } }
    if (navigator.vibrate) { try{ navigator.vibrate([120,60,900,60,1400,80,900,80,1200,80,1000,80,1400]); }catch(e){} }
    startShake();

    scareNameEl.textContent = name + '！！别回头！';
    later(function(){ scareNameEl.style.opacity = '0'; }, 1400);

    // 中途镜像切换 = 重影惊悚
    later(function(){ $('#faceWrap').classList.add('mirror'); }, 1900);
    later(function(){ $('#faceWrap').classList.remove('mirror'); }, 2350);
    later(function(){ $('#faceWrap').classList.add('mirror'); }, 2800);
    later(function(){ $('#faceWrap').classList.remove('mirror'); }, 3050);
    later(function(){ $('#faceWrap').classList.add('mirror'); }, 3900);
    later(function(){ $('#faceWrap').classList.remove('mirror'); }, 4350);
    later(function(){ $('#faceWrap').classList.add('mirror'); }, 4900);
    later(function(){ $('#faceWrap').classList.remove('mirror'); }, 5350);
    later(function(){ $('#faceWrap').classList.add('mirror'); }, 6000);
    later(function(){ $('#faceWrap').classList.remove('mirror'); }, 6450);
    later(function(){ $('#faceWrap').classList.add('mirror'); }, 7100);
    later(function(){ $('#faceWrap').classList.remove('mirror'); }, 7500);

    // 标题栏闪动
    var flip = false;
    titleTimer = setInterval(function(){
      document.title = (flip = !flip) ? '😱😱😱😱😱' : '啊啊啊啊啊啊！';
    }, 350);

    later(endScare, 8000);
  }

  function startShake(){
    var el = $('#shakeLayer'), t0 = performance.now();
    (function loop(now){
      var t = (now - t0)/1000;
      var k = Math.min(1, 0.35 + t*0.7) * 24;
      el.style.transform = 'translate(' + ((Math.random()*2-1)*k) + 'px,' + ((Math.random()*2-1)*k*0.7) + 'px) rotate(' + ((Math.random()*2-1)*1.5) + 'deg)';
      shakeRAF = requestAnimationFrame(loop);
    })(t0);
  }
  function stopShake(){
    if (shakeRAF) cancelAnimationFrame(shakeRAF);
    shakeRAF = 0;
    $('#shakeLayer').style.transform = '';
  }

  function endScare(){
    clearTimers(); stopShake();
    if (titleTimer) { clearInterval(titleTimer); titleTimer = null; }
    document.title = '2026 灵魂运势测试 · 超准';
    if (!MUTED) stopScareAudio();
    $('#scare').classList.remove('on');
    hide($('#scare'));
    $('#blackout').classList.add('on');
    later(showReveal, 950);
  }

  function showReveal(){
    $('#blackout').classList.remove('on');
    var name = ($('#nameInput').value || '').trim() || '朋友';
    $('#revealTitle').textContent = '恭喜 ' + name + '，你被整蛊啦！';
    $('#revealJoke').textContent = '别慌，什么都没有从屏幕里爬出来 —— 这只是一场恶作剧。深呼吸，擦擦冷汗，然后把这份惊吓原封不动地传给你的朋友吧 😈';
    show($('#reveal'));
    if (!MUTED) { try { chime(); } catch(e){ (window.__audioErr=window.__audioErr||[]).push('chime:'+((e&&e.message)||e)); } }
    countUp($('#bpmNum'), 178, 900);
    countUp($('#dbNum'), 92, 900);
  }

  function countUp(el, target, dur){
    var t0 = performance.now();
    (function step(now){
      var p = Math.min(1, (now-t0)/dur);
      el.textContent = Math.round(target * (1-Math.pow(1-p,3)));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function resetAll(){
    clearTimers(); stopShake();
    if (titleTimer) { clearInterval(titleTimer); titleTimer = null; document.title = '2026 灵魂运势测试 · 超准'; }
    if (ctx && !MUTED) { stopScareAudio(); stopTension(true); }
    hide($('#reveal')); hide($('#scare')); hide($('#loading'));
    $('#scare').classList.remove('on');
    $('#faceWrap').classList.remove('mirror');
    scareNameEl.style.opacity = '1';
    barEl.style.width = '0%'; pctEl.textContent = '0%';
    loadStepEl.textContent = '正在连接命运服务器……';
    $('#blackout').classList.remove('on');
    show($('#landing'));
    $('#nameInput').focus();
  }

  /* ================= 事件绑定 ================= */
  $('#startBtn').addEventListener('click', startLoading);
  $('#nameInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') startLoading();
  });
  $('#againBtn').addEventListener('click', resetAll);
  $('#shareBtn').addEventListener('click', function(){
    var url = location.href.split('#')[0].split('?')[0];
    function ok(){ toast('✅ 链接已复制！发给朋友，看谁先被吓飞 😈'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(ok, function(){ fallbackCopy(url, ok); });
    } else fallbackCopy(url, ok);
  });
  function fallbackCopy(text, ok){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch(e){ toast('复制失败，请手动复制地址栏链接'); }
    document.body.removeChild(ta);
  }
  var toastTimer = null;
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }
  // Esc = 吓到受不了的人随时可以退出（人道主义出口）
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !$('#scare').hidden) endScare();
  });
})();
</script>
